name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same ref (PR or branch) when a new commit
# arrives — saves cycles on rapid-fire pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + typecheck + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  package-shape:
    name: Package shape (publint + attw)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:pack

  install-smoke:
    name: Install-path smoke (npm pack → global install → verify-aul)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack tarball
        run: npm pack
      - name: Global install and invoke
        run: |
          set -euo pipefail
          TARBALL=$(ls truetake-verify-aul-*.tgz | head -1)
          npm install -g "./${TARBALL}" --ignore-scripts
          verify-aul --help
          # Exit 2 on unknown subcommand, exit 0 on help
          set +e
          verify-aul foo
          test $? -eq 2

  trust-anchor-checks:
    name: Trust anchors (sync + fingerprint + disjointness)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:trust-anchors
      - run: npm run check:fingerprints-disjoint

  schema-vectors:
    name: Spec schema / test-vector coherence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:schema-vectors
      # Determinism gate: the offline phase must produce byte-identical
      # field-commitment vectors on every run. Network phase is excluded
      # (TSA minting + fresh fixtures CA keys are non-deterministic).
      - name: Regenerate offline field-commitment vectors
        run: npm run fixtures:generate:offline
      - name: Verify no diff in field-commitment vectors
        run: git diff --exit-code spec/test-vectors/field-commitment-*.json

  web-build:
    name: Web UI (esbuild)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:web
      - name: Verify CSP meta present in index.html
        run: |
          grep 'http-equiv="Content-Security-Policy"' web/dist/index.html
      - name: Verify MANIFEST.sha256 shipped
        run: |
          test -f web/dist/MANIFEST.sha256
          test -s web/dist/MANIFEST.sha256
          cat web/dist/MANIFEST.sha256

  # Aggregate status check — this job's success is the one the main-branch
  # Ruleset will require (see docs/plans for the Unit 1 ruleset deferral note).
  ci:
    name: ci
    needs:
      - lint-test
      - package-shape
      - install-smoke
      - trust-anchor-checks
      - schema-vectors
      - web-build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      # Checkout runs first, so a failed upstream job can't stop zizmor from
      # having the workflows to scan.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Report aggregate status
        run: |
          if [ "${{ needs.lint-test.result }}" != "success" ] \
            || [ "${{ needs.package-shape.result }}" != "success" ] \
            || [ "${{ needs.install-smoke.result }}" != "success" ] \
            || [ "${{ needs.trust-anchor-checks.result }}" != "success" ] \
            || [ "${{ needs.schema-vectors.result }}" != "success" ] \
            || [ "${{ needs.web-build.result }}" != "success" ]; then
            echo "One or more upstream jobs failed"
            exit 1
          fi
          echo "All checks passed"
      # Workflow security audit (https://docs.zizmor.sh). Fails on High
      # findings only. --offline skips the audits that query GitHub's API, so
      # the check can't turn red without a commit. zizmor comes from its
      # GitHub release, sha256-checked; bump ZIZMOR_VERSION and ZIZMOR_SHA256
      # together. Plain output, not --format=github: GitHub shows at most 10
      # error annotations per step.
      - name: Audit workflow security (zizmor)
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/zizmor.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --offline --min-severity=high --color=always .github
        shell: bash
